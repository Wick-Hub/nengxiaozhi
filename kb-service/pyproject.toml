[project]
name = "kb-service"
version = "0.1.0"
description = "能小智校园 AI 助手平台 —— Python 服务层（RAG 引擎 + 核心 API）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    # 数据层（任务 1.14）：KB_STORE=mysql 是生产路径，API 层直接引用仓储，故列为必需
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "cryptography>=42",
]

[project.optional-dependencies]
# 数据层依赖已提升到 dependencies；保留 `db` extra 作为向后兼容的空别名，
# 使既有的 `pip install -e ".[db]"` 仍可正常执行。
db = []
# 解析层（任务 1.2 / 1.10）
parse = [
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "pypdf>=4.2",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "xlwt>=1.3",  # 仅用于生成 .xls 验收样例（tools/make_samples.py）
    "beautifulsoup4>=4.12",
    "markdown-it-py>=3.0",
    # 第 12 类格式（图片）需要它读元信息；OCR 也依赖它做图像预处理
    "Pillow>=10.3",
]
# OCR（任务 1.10）：rapidocr-onnxruntime 为默认引擎（模型随 wheel 分发、无需系统软件）；
# 已装 ml extra 时 onnxruntime 复用。tesseract 走系统安装 + TESSERACT_BIN 配置，不入本 extra。
ocr = [
    "rapidocr-onnxruntime>=1.3",
]
# 向量与精排（任务 1.4 / 1.6）
ml = [
    "numpy>=1.26",
    "onnxruntime>=1.18",
    "tokenizers>=0.19",
    "huggingface-hub>=0.23",
]
# 备选 PyTorch 后端（体积大，含 torch；离线交付默认不装，见 deploy/offline/requirements-runtime.txt）
st = [
    "sentence-transformers>=3.0",
]
# 生成（任务 1.7）
llm = [
    "httpx>=0.27",
]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
